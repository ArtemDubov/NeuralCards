version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: neuraltrident
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/neuraltrident"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./server:/app/server
      - ./prisma:/app/prisma

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - /app/node_modules/.vite
      - /app/node_modules/.cache
    stdin_open: true
    tty: true
    depends_on:
      - app

volumes:
  postgres_data:
